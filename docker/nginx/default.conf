map "$request_method:$uri" $admin_rate_key {
    default "";
    "POST:/admin.php" $binary_remote_addr;
}
limit_req_zone $admin_rate_key zone=admin_posts:10m rate=5r/m;

map "$request_method:$uri:$arg_action" $student_login_rate_key {
    default "";
    "POST:/api.php:login" $binary_remote_addr;
}
limit_req_zone $student_login_rate_key zone=student_logins:10m rate=5r/m;

server {
    listen 80;
    server_name localhost;
    root /var/www/html/public;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~ \.php$ {
        limit_req zone=admin_posts burst=5 nodelay;
        limit_req zone=student_logins burst=5 nodelay;
        limit_req_status 429;
        fastcgi_pass php:9000;
        fastcgi_index api.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTPS $https if_not_empty;
    }
}
