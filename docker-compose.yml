services:
  nginx:
    image: nginx:alpine
    container_name: geo_nginx
    ports:
      - "${HTTP_PORT}:80"
    volumes:
      - ./public:/var/www/html/public
      - ./src:/var/www/html/src
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php
    networks:
      - geo_net

  php:
    build: ./docker/php
    container_name: geo_php
    volumes:
      - ./public:/var/www/html/public
      - ./src:/var/www/html/src
    environment:
      DB_HOST: ${DB_HOST}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASS: ${DB_PASS}
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - geo_net

  mysql:
    image: mysql:8.0
    container_name: geo_mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASS}
    ports:
      - "${MYSQL_PORT}:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
    volumes:
      - db_data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - geo_net

networks:
  geo_net:
    driver: bridge

volumes:
  db_data:
